x-shared_service_config: &shared_service_config
  depends_on:
    - shell
    - user-service
  env_file:
    - .env
  ports:
    - "80:80"
    - "443:443"
  # extra_hosts:
  #   - host.docker.internal:host-gateway
  init: true
  restart: unless-stopped
  stdin_open: true
  tty: true
  volumes:
    - "${CERT_PATH}:/etc/ssl/certs"
  # networks:
  #   - micro-frontend

services:
  apache:
    <<: *shared_service_config
    container_name: inventory-apache
    image: inventory-apache
    build:
      dockerfile: Dockerfile
      context: ./apache
    profiles:
      - apache
  nginx:
    <<: *shared_service_config
    container_name: inventory-nginx
    image: inventory-nginx
    build:
      dockerfile: Dockerfile
      context: ./nginx
    profiles:
      - nginx
  shell:
    stdin_open: true
    container_name: inventory-shell
    image: inventory-shell
    build:
      dockerfile: ./projects/shell/Dockerfile
      context: .
    env_file:
      - .env
    ports:
      - "${SHELL_PORT}:80"
  user-service:
    stdin_open: true
    container_name: inventory-user
    image: inventory-user
    build:
      dockerfile: ./projects/user-service/frontend/Dockerfile
      context: .
    env_file:
      - .env
    ports:
      - "${USER_PORT}:80"
