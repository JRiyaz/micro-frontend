<VirtualHost *:80>
    ServerName localhost.com
    Redirect / https://localhost.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost.com
    Protocols h2 http/1.1

    SSLEngine on
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    SSLProtocol -ALL +TLSv1.2 +TLSv1.1 +TLSv1
    SSLHonorCipherOrder On
    SSLCipherSuite !SSLv2:!EXPORT:!DHE+AES-GCM:!DHE+AES:!DHE+3DES:ECDHE+AES-GCM:ECDHE+AES:RSA+AES-GCM:RSA+AES:ECDHE+3DES:RSA+3DES:-MD5:SSLv3:-RC4
    SSLCertificateFile /etc/ssl/certs/localhost.crt
    SSLCertificateKeyFile /etc/ssl/certs/localhost.key
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off

    Include conf/mod_headers.conf
    AddDefaultCharset UTF-8

    ProxyPreserveHost on
    RewriteEngine on

    # Root URL redirect to shell service
    RewriteRule "^/$" "${SHELL_HOST}:${SHELL_PORT}/" [P,L]

    # User service routing
    RewriteRule "^/user(.*)$" "${USER_HOST}:${USER_PORT}$1" [P,QSA,L]

    # Shell service routing for all other requests
    RewriteRule "^(.*)$" "${SHELL_HOST}:${SHELL_PORT}$1" [P,QSA,L]

    # Proxy settings
    ProxyPassReverse "/" "${SHELL_HOST}:${SHELL_PORT}/"
    ProxyPassReverse "/user/" "${USER_HOST}:${USER_PORT}/"
</VirtualHost>
