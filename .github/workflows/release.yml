name: Release Desktop Applications

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever you push a version tag (e.g., v0.1.0)

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: pnpm install

      - name: Build Standalone Angular Assets
        run: node bundle-desktop.js

      - name: Compile and Release Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Inventory Hub Desktop ${{ github.ref_name }}'
          releaseBody: 'Production release setup installers for Windows (EXE/MSI) and macOS (DMG).'
          releaseDraft: true
          prerelease: false
          args: '--features bundled_assets'
